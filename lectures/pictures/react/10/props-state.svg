<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <rect width="720" height="400" fill="#1e1e2e"/>

  <!-- Parent -->
  <rect x="220" y="20" width="280" height="80" rx="8" fill="#61DAFB"/>
  <text x="360" y="50" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="16" font-weight="bold">Parent</text>
  <text x="360" y="75" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="13">state = &#123; name: "Anna" &#125;</text>

  <!-- Arrows down (props) -->
  <line x1="280" y1="100" x2="180" y2="170" stroke="#4a9eff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="440" y1="100" x2="540" y2="170" stroke="#4a9eff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="200" y="140" fill="#4a9eff" font-family="monospace" font-size="13">props name="Anna"</text>
  <text x="450" y="140" fill="#4a9eff" font-family="monospace" font-size="13">props name="Anna"</text>

  <!-- Child A -->
  <rect x="80" y="170" width="200" height="80" rx="8" fill="#4a9eff"/>
  <text x="180" y="200" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" font-weight="bold">Child A</text>
  <text x="180" y="225" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">&lt;h1&gt;Hello, Anna&lt;/h1&gt;</text>

  <!-- Child B -->
  <rect x="440" y="170" width="200" height="80" rx="8" fill="#4a9eff"/>
  <text x="540" y="200" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" font-weight="bold">Child B</text>
  <text x="540" y="225" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">&lt;p&gt;Name: Anna&lt;/p&gt;</text>

  <!-- Arrow up (callback) -->
  <line x1="360" y1="170" x2="360" y2="110" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowR)"/>
  <text x="380" y="145" fill="#ff6b6b" font-family="monospace" font-size="12">onNameChange()</text>

  <!-- Legend -->
  <rect x="40" y="290" width="640" height="90" rx="8" fill="#2a2a3e"/>
  <line x1="60" y1="315" x2="100" y2="315" stroke="#4a9eff" stroke-width="3"/>
  <text x="110" y="320" fill="#ccc" font-family="monospace" font-size="14">Props — потік даних вниз (parent &#8594; child)</text>
  <line x1="60" y1="345" x2="100" y2="345" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="110" y="350" fill="#ccc" font-family="monospace" font-size="14">Callbacks — потік подій вгору (child &#8594; parent)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9eff"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/>
    </marker>
  </defs>
</svg>