<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <rect width="720" height="320" fill="#1e1e2e"/>

  <!-- Timeline -->
  <line x1="60" y1="160" x2="660" y2="160" stroke="#444" stroke-width="3"/>

  <!-- 2013 -->
  <circle cx="120" cy="160" r="10" fill="#61DAFB"/>
  <text x="120" y="190" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="14" font-weight="bold">2013</text>
  <text x="120" y="210" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">Open Sourced</text>
  <text x="120" y="135" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">React 0.3</text>

  <!-- 2015 -->
  <circle cx="240" cy="160" r="10" fill="#4a9eff"/>
  <text x="240" y="190" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="14" font-weight="bold">2015</text>
  <text x="240" y="210" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">React Native</text>
  <text x="240" y="135" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">React 0.14</text>

  <!-- 2018 -->
  <circle cx="360" cy="160" r="10" fill="#51cf66"/>
  <text x="360" y="190" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="14" font-weight="bold">2018</text>
  <text x="360" y="210" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">React 16.8</text>
  <text x="360" y="135" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">Hooks!</text>

  <!-- 2022 -->
  <circle cx="480" cy="160" r="10" fill="#ff6b6b"/>
  <text x="480" y="190" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="14" font-weight="bold">2022</text>
  <text x="480" y="210" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">React 18</text>
  <text x="480" y="135" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">Concurrent</text>

  <!-- 2024 -->
  <circle cx="600" cy="160" r="10" fill="#d19a66"/>
  <text x="600" y="190" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="14" font-weight="bold">2024+</text>
  <text x="600" y="210" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">React 19</text>
  <text x="600" y="135" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">RSC, Actions</text>

  <!-- Title -->
  <text x="360" y="40" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Історія розвитку React</text>
  <text x="360" y="65" text-anchor="middle" fill="#888" font-family="monospace" font-size="13">Створений у Facebook (Jordan Walke, 2011)</text>

  <!-- Bottom note -->
  <text x="360" y="275" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="13">React — бібліотека, що ввела компонентну модель та Virtual DOM у маси</text>
  <text x="360" y="295" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="12">Перейшов від класових компонентів &#8594; функціональним з Hooks &#8594; Server Components</text>
</svg>