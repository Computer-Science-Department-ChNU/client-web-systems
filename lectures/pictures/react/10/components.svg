<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#1e1e2e"/>

  <!-- App -->
  <rect x="280" y="20" width="160" height="60" rx="8" fill="#61DAFB"/>
  <text x="360" y="55" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="16" font-weight="bold">App</text>

  <!-- Lines from App -->
  <line x1="360" y1="80" x2="160" y2="150" stroke="#888" stroke-width="2"/>
  <line x1="360" y1="80" x2="360" y2="150" stroke="#888" stroke-width="2"/>
  <line x1="360" y1="80" x2="560" y2="150" stroke="#888" stroke-width="2"/>

  <!-- Header -->
  <rect x="80" y="150" width="160" height="60" rx="8" fill="#4a9eff"/>
  <text x="160" y="185" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" font-weight="bold">Header</text>

  <!-- Content -->
  <rect x="280" y="150" width="160" height="60" rx="8" fill="#4a9eff"/>
  <text x="360" y="185" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" font-weight="bold">Content</text>

  <!-- Footer -->
  <rect x="480" y="150" width="160" height="60" rx="8" fill="#4a9eff"/>
  <text x="560" y="185" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" font-weight="bold">Footer</text>

  <!-- Lines from Content -->
  <line x1="360" y1="210" x2="260" y2="280" stroke="#888" stroke-width="2"/>
  <line x1="360" y1="210" x2="460" y2="280" stroke="#888" stroke-width="2"/>

  <!-- Card -->
  <rect x="180" y="280" width="160" height="60" rx="8" fill="#ff6b6b"/>
  <text x="260" y="315" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" font-weight="bold">Card</text>

  <!-- List -->
  <rect x="380" y="280" width="160" height="60" rx="8" fill="#ff6b6b"/>
  <text x="460" y="315" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" font-weight="bold">List</text>

  <!-- Labels -->
  <text x="360" y="405" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="14">Дерево компонентів React</text>
</svg>