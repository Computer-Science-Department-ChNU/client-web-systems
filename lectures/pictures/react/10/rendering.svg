<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <rect width="720" height="460" fill="#1e1e2e"/>

  <!-- Step 1: setState -->
  <rect x="40" y="30" width="180" height="70" rx="8" fill="#61DAFB"/>
  <text x="130" y="60" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="14" font-weight="bold">1. setState()</text>
  <text x="130" y="80" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="11">Зміна стану</text>

  <line x1="220" y1="65" x2="280" y2="65" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 2: re-render -->
  <rect x="280" y="30" width="180" height="70" rx="8" fill="#4a9eff"/>
  <text x="370" y="60" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14" font-weight="bold">2. Re-render</text>
  <text x="370" y="80" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Нове Virtual DOM дерево</text>

  <line x1="460" y1="65" x2="520" y2="65" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 3: Diff -->
  <rect x="520" y="30" width="160" height="70" rx="8" fill="#ff6b6b"/>
  <text x="600" y="60" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14" font-weight="bold">3. Reconciliation</text>
  <text x="600" y="80" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Diffing алгоритм</text>

  <line x1="600" y1="100" x2="600" y2="160" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 4: Commit -->
  <rect x="520" y="160" width="160" height="70" rx="8" fill="#51cf66"/>
  <text x="600" y="190" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="14" font-weight="bold">4. Commit</text>
  <text x="600" y="210" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="11">Оновлення DOM</text>

  <line x1="520" y1="195" x2="460" y2="195" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Result -->
  <rect x="280" y="160" width="180" height="70" rx="8" fill="#2a2a3e" stroke="#888"/>
  <text x="370" y="195" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="13">UI оновлено</text>
  <text x="370" y="215" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">тільки змінені вузли</text>

  <!-- Virtual DOM trees -->
  <text x="370" y="270" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="16" font-weight="bold">Virtual DOM Diff</text>

  <!-- Old tree -->
  <rect x="60" y="300" width="200" height="140" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="160" y="325" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">Старе дерево</text>
  <text x="80" y="355" fill="#ccc" font-family="monospace" font-size="12">&lt;div&gt;</text>
  <text x="100" y="375" fill="#ccc" font-family="monospace" font-size="12">&lt;h1&gt;Hello&lt;/h1&gt;</text>
  <text x="100" y="395" fill="#ff6b6b" font-family="monospace" font-size="12">&lt;p&gt;0&lt;/p&gt;</text>
  <text x="80" y="415" fill="#ccc" font-family="monospace" font-size="12">&lt;/div&gt;</text>

  <!-- vs -->
  <text x="310" y="375" text-anchor="middle" fill="#888" font-family="monospace" font-size="24">&#8656;</text>

  <!-- New tree -->
  <rect x="340" y="300" width="200" height="140" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="440" y="325" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">Нове дерево</text>
  <text x="360" y="355" fill="#ccc" font-family="monospace" font-size="12">&lt;div&gt;</text>
  <text x="380" y="375" fill="#ccc" font-family="monospace" font-size="12">&lt;h1&gt;Hello&lt;/h1&gt;</text>
  <text x="380" y="395" fill="#51cf66" font-family="monospace" font-size="12">&lt;p&gt;1&lt;/p&gt;</text>
  <text x="360" y="415" fill="#ccc" font-family="monospace" font-size="12">&lt;/div&gt;</text>

  <text x="580" y="380" fill="#51cf66" font-family="monospace" font-size="14">diff = &lt;p&gt;</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
</svg>