<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="720" height="380">
  <rect width="780" height="380" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">State &#8593; Props &#8594; UI</text>

  <!-- State box -->
  <rect x="40" y="60" width="180" height="100" rx="8" fill="#2a2a3e" stroke="#ff6b6b"/>
  <text x="130" y="90" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="15" font-weight="bold">State</text>
  <text x="130" y="115" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">Внутрішні дані</text>
  <text x="130" y="135" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">компонента</text>
  <text x="130" y="155" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">useState()</text>

  <!-- Arrow state -> UI -->
  <line x1="220" y1="110" x2="300" y2="110" stroke="#888" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Component / UI -->
  <rect x="300" y="60" width="180" height="100" rx="8" fill="#2a2a3e" stroke="#61DAFB"/>
  <text x="390" y="90" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="15" font-weight="bold">Component</text>
  <text x="390" y="115" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">Функція, що</text>
  <text x="390" y="135" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">повертає JSX</text>
  <text x="390" y="155" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">render()</text>

  <!-- Arrow props -> UI -->
  <line x1="560" y1="110" x2="480" y2="110" stroke="#888" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Props box -->
  <rect x="560" y="60" width="180" height="100" rx="8" fill="#2a2a3e" stroke="#4a9eff"/>
  <text x="650" y="90" text-anchor="middle" fill="#4a9eff" font-family="monospace" font-size="15" font-weight="bold">Props</text>
  <text x="650" y="115" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">Дані від батька</text>
  <text x="650" y="135" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">(read-only)</text>
  <text x="650" y="155" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">&lt;Child name=... /&gt;</text>

  <!-- Output -->
  <line x1="390" y1="160" x2="390" y2="210" stroke="#888" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="280" y="210" width="220" height="70" rx="8" fill="#2a2a3e" stroke="#51cf66"/>
  <text x="390" y="240" text-anchor="middle" fill="#51cf66" font-family="monospace" font-size="15" font-weight="bold">Virtual DOM</text>
  <text x="390" y="265" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">React.createElement(...)</text>

  <line x1="390" y1="280" x2="390" y2="320" stroke="#888" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="280" y="320" width="220" height="50" rx="8" fill="#2a2a3e" stroke="#888"/>
  <text x="390" y="352" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="14">Real DOM</text>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
</svg>
