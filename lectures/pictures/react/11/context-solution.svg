<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450">
  <rect width="720" height="4560" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#51cf66" font-family="monospace" font-size="18" font-weight="bold">Context — рішення props drilling</text>

  <!-- Context Provider wraps everything -->
  <rect x="40" y="55" width="640" height="345" rx="10" fill="none" stroke="#51cf66" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="75" fill="#51cf66" font-family="monospace" font-size="13" font-weight="bold">UserContext.Provider value=&#123;user&#125;</text>

  <!-- App -->
  <rect x="280" y="90" width="160" height="50" rx="8" fill="#61DAFB"/>
  <text x="360" y="120" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="14" font-weight="bold">App</text>

  <line x1="360" y1="140" x2="360" y2="170" stroke="#888" stroke-width="2"/>

  <!-- Layout -->
  <rect x="280" y="170" width="160" height="50" rx="8" fill="#4a9eff"/>
  <text x="360" y="200" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14" font-weight="bold">Layout</text>

  <line x1="360" y1="220" x2="360" y2="250" stroke="#888" stroke-width="2"/>

  <!-- Sidebar -->
  <rect x="280" y="250" width="160" height="50" rx="8" fill="#4a9eff"/>
  <text x="360" y="280" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14" font-weight="bold">Sidebar</text>

  <!-- UserProfile consumes context directly -->
  <line x1="200" y1="350" x2="280" y2="350" stroke="#51cf66" stroke-width="2" marker-end="url(#g)"/>

  <rect x="280" y="325" width="160" height="50" rx="8" fill="#51cf66"/>
  <text x="360" y="355" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="14" font-weight="bold">UserProfile</text>

  <text x="110" y="355" fill="#51cf66" font-family="monospace" font-size="12">useContext()</text>

  <text x="360" y="425" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="13">UserProfile читає user напряму з Context &#8212; без передачі через props</text>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#51cf66"/>
    </marker>
  </defs>
</svg>
