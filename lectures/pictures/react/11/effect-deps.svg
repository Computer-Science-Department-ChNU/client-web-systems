<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <rect width="720" height="360" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">useEffect — залежності (deps)</text>

  <!-- Render cycle -->
  <rect x="20" y="60" width="210" height="80" rx="8" fill="#2a2a3e" stroke="#61DAFB"/>
  <text x="125" y="85" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="13" font-weight="bold">Component Render</text>
  <text x="125" y="110" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">React викликає функцію</text>
  <text x="125" y="128" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">і повертає JSX</text>

  <line x1="230" y1="100" x2="280" y2="100" stroke="#888" stroke-width="2" marker-end="url(#d)"/>

  <!-- Commit -->
  <rect x="280" y="60" width="210" height="80" rx="8" fill="#2a2a3e" stroke="#4a9eff"/>
  <text x="385" y="85" text-anchor="middle" fill="#4a9eff" font-family="monospace" font-size="13" font-weight="bold">DOM Commit</text>
  <text x="385" y="110" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">React оновлює DOM</text>
  <text x="385" y="128" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">(paint)</text>

  <line x1="490" y1="100" x2="540" y2="100" stroke="#888" stroke-width="2" marker-end="url(#d)"/>

  <!-- Effect -->
  <rect x="540" y="60" width="160" height="80" rx="8" fill="#2a2a3e" stroke="#d19a66"/>
  <text x="620" y="85" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="13" font-weight="bold">useEffect</text>
  <text x="620" y="110" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">виконується</text>
  <text x="620" y="128" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12">після paint</text>

  <text x="360" y="175" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">useEffect виконується ПІСЛЯ рендеру та DOM-оновлення</text>

  <!-- Deps scenarios -->
  <rect x="20" y="200" width="220" height="140" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="130" y="225" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="14" font-weight="bold">[ ] — кожен рендер</text>
  <text x="35" y="250" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="50" y="268" fill="#ccc" font-family="monospace" font-size="12">// runs every render</text>
  <text x="35" y="286" fill="#ccc" font-family="monospace" font-size="12">});</text>
  <text x="35" y="320" fill="#ff6b6b" font-family="monospace" font-size="11">рідко потрібен</text>

  <rect x="250" y="200" width="220" height="140" rx="8" fill="#1a1a2e" stroke="#d19a66"/>
  <text x="360" y="225" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="14" font-weight="bold">[dep] — при зміні dep</text>
  <text x="265" y="250" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="280" y="268" fill="#ccc" font-family="monospace" font-size="12">// runs when dep changes</text>
  <text x="265" y="286" fill="#ccc" font-family="monospace" font-size="12">}, [dep]);</text>
  <text x="265" y="320" fill="#d19a66" font-family="monospace" font-size="11">найчастіший варіант</text>

  <rect x="480" y="200" width="220" height="140" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="590" y="225" text-anchor="middle" fill="#51cf66" font-family="monospace" font-size="14" font-weight="bold">[] — один раз (mount)</text>
  <text x="495" y="250" fill="#ccc" font-family="monospace" font-size="12">useEffect(() =&gt; {</text>
  <text x="510" y="268" fill="#ccc" font-family="monospace" font-size="12">// runs once on mount</text>
  <text x="495" y="286" fill="#ccc" font-family="monospace" font-size="12">}, []);</text>
  <text x="495" y="320" fill="#51cf66" font-family="monospace" font-size="11">init, subscriptions</text>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
</svg>
