<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Lifting State Up — підняття стану</text>

  <!-- Before: separate state -->
  <rect x="20" y="55" width="330" height="180" rx="8" fill="#1a1a2e" stroke="#ff6b6b"/>
  <text x="40" y="80" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">БЕЗ спільного стану</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">function SearchBar() {</text>
  <text x="55" y="123" fill="#ccc" font-family="monospace" font-size="12">const [query, setQuery] = useState("");</text>
  <text x="55" y="141" fill="#ccc" font-family="monospace" font-size="12">return &lt;input ... /&gt;;</text>
  <text x="40" y="159" fill="#ccc" font-family="monospace" font-size="12">}</text>
  <text x="40" y="183" fill="#ccc" font-family="monospace" font-size="12">function ProductList() {</text>
  <text x="55" y="201" fill="#ccc" font-family="monospace" font-size="12">// &#129300; як отримати query?</text>
  <text x="40" y="219" fill="#ccc" font-family="monospace" font-size="12">}</text>

  <!-- Arrow -->
  <text x="370" y="140" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="30">&#8651;</text>

  <!-- After: lifted -->
  <rect x="390" y="55" width="310" height="180" rx="8" fill="#1a1a2e" stroke="#51cf66"/>
  <text x="410" y="80" fill="#51cf66" font-family="monospace" font-size="13" font-weight="bold">Lifted to parent</text>
  <text x="410" y="105" fill="#ccc" font-family="monospace" font-size="12">function App() {</text>
  <text x="425" y="123" fill="#ccc" font-family="monospace" font-size="12">const [query, setQuery] = useState("");</text>
  <text x="425" y="141" fill="#ccc" font-family="monospace" font-size="12">return (&lt;&gt;</text>
  <text x="440" y="159" fill="#ccc" font-family="monospace" font-size="12">&lt;SearchBar value={query}</text>
  <text x="465" y="177" fill="#ccc" font-family="monospace" font-size="12"> onChange={setQuery} /&gt;</text>
  <text x="440" y="195" fill="#ccc" font-family="monospace" font-size="12">&lt;ProductList query={query} /&gt;</text>
  <text x="425" y="213" fill="#ccc" font-family="monospace" font-size="12">&lt;/&gt;);</text>
  <text x="410" y="231" fill="#ccc" font-family="monospace" font-size="12">}</text>

  <!-- Diagram -->
  <rect x="260" y="240" width="200" height="60" rx="8" fill="#61DAFB"/>
  <text x="360" y="270" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="14" font-weight="bold">App</text>
  <text x="360" y="290" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="11">query = "laptop"</text>

  <line x1="300" y1="300" x2="180" y2="340" stroke="#4a9eff" stroke-width="2" marker-end="url(#l)"/>
  <line x1="420" y1="300" x2="540" y2="340" stroke="#4a9eff" stroke-width="2" marker-end="url(#l)"/>
  <text x="210" y="320" fill="#fff" font-family="monospace" font-size="11">props: value, onChange</text>
  <text x="430" y="320" fill="#fff" font-family="monospace" font-size="11">props: query</text>

  <rect x="80" y="340" width="160" height="50" rx="8" fill="#4a9eff"/>
  <text x="160" y="370" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13" font-weight="bold">SearchBar</text>

  <rect x="480" y="340" width="160" height="50" rx="8" fill="#4a9eff"/>
  <text x="560" y="370" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13" font-weight="bold">ProductList</text>

  <defs>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9eff"/>
    </marker>
  </defs>
</svg>
