<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
    <rect width="720" height="460" fill="#1e1e2e"/>

    <!-- Title -->
    <text x="360" y="35"
          text-anchor="middle"
          fill="#61DAFB"
          font-family="monospace"
          font-size="18"
          font-weight="bold">
        JWT (JSON Web Token) — структура
    </text>

    <!-- Token visualization -->
    <rect x="20" y="60" width="680" height="50" rx="6"
          fill="#2a2a3e" stroke="#444"/>

    <text x="35" y="100"
          fill="#d19a66"
          font-family="monospace"
          font-size="10">
        eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
    </text>

    <text x="225" y="80"
          fill="#4a9eff"
          font-family="monospace"
          font-size="10">
        .eyJ1c2VyIjp7ImlkIjoiNDIiLCJyb2xlIjoiYWRtaW4ifQ
    </text>

    <text x="525" y="100"
          fill="#51cf66"
          font-family="monospace"
          font-size="10">
        .SflKxwRJSMeKKF2QT4f
    </text>

    <!-- Connectors -->
    <line x1="140" y1="110" x2="140" y2="135"
          stroke="#d19a66" stroke-width="2"/>

    <line x1="360" y1="110" x2="360" y2="135"
          stroke="#4a9eff" stroke-width="2"/>

    <line x1="580" y1="110" x2="580" y2="135"
          stroke="#51cf66" stroke-width="2"/>

    <!-- Header -->
    <rect x="40" y="135" width="200" height="130" rx="8"
          fill="#1a1a2e" stroke="#d19a66"/>

    <text x="140" y="160"
          text-anchor="middle"
          fill="#d19a66"
          font-family="monospace"
          font-size="14"
          font-weight="bold">
        HEADER
    </text>

    <text x="55" y="185" fill="#ccc" font-family="monospace" font-size="11">{</text>
    <text x="65" y="202" fill="#ccc" font-family="monospace" font-size="11">
        "alg": "HS256",
    </text>
    <text x="65" y="219" fill="#ccc" font-family="monospace" font-size="11">
        "typ": "JWT"
    </text>
    <text x="55" y="236" fill="#ccc" font-family="monospace" font-size="11">}</text>

    <!-- Payload -->
    <rect x="260" y="135" width="200" height="130" rx="8"
          fill="#1a1a2e" stroke="#4a9eff"/>

    <text x="360" y="160"
          text-anchor="middle"
          fill="#4a9eff"
          font-family="monospace"
          font-size="14"
          font-weight="bold">
        PAYLOAD
    </text>

    <text x="275" y="185" fill="#ccc" font-family="monospace" font-size="11">{</text>
    <text x="285" y="202" fill="#ccc" font-family="monospace" font-size="11">
        "user": {"id": 42,
    </text>
    <text x="285" y="219" fill="#ccc" font-family="monospace" font-size="11">
        "role": "admin"},
    </text>
    <text x="285" y="236" fill="#ccc" font-family="monospace" font-size="11">
        "exp": 1700000000
    </text>
    <text x="275" y="253" fill="#ccc" font-family="monospace" font-size="11">}</text>

    <!-- Signature -->
    <rect x="480" y="135" width="200" height="130" rx="8"
          fill="#1a1a2e" stroke="#51cf66"/>

    <text x="580" y="160"
          text-anchor="middle"
          fill="#51cf66"
          font-family="monospace"
          font-size="14"
          font-weight="bold">
        SIGNATURE
    </text>

    <text x="495" y="185" fill="#ccc" font-family="monospace" font-size="11">
        HMACSHA256(
    </text>
    <text x="505" y="202" fill="#ccc" font-family="monospace" font-size="11">
        base64(header) +
    </text>
    <text x="505" y="219" fill="#ccc" font-family="monospace" font-size="11">
        base64(payload),
    </text>
    <text x="505" y="236" fill="#ccc" font-family="monospace" font-size="11">
        SECRET_KEY)
    </text>

    <!-- Properties -->
    <rect x="20" y="285" width="680" height="175" rx="8"
          fill="#2a2a3e" stroke="#444"/>

    <text x="40" y="310"
          fill="#61DAFB"
          font-family="monospace"
          font-size="14"
          font-weight="bold">
        Властивості JWT:
    </text>

    <text x="40" y="330"
          fill="#ccc"
          font-family="monospace"
          font-size="12">
        + Stateless — server не зберігає сесію
    </text>

    <text x="40" y="350"
          fill="#ccc"
          font-family="monospace"
          font-size="12">
        + Self-contained — дані користувача всередині payload
    </text>

    <text x="40" y="370"
          fill="#ccc"
          font-family="monospace"
          font-size="12">
        + Підпис — server перевіряє цілісність token
    </text>

    <text x="40" y="390"
          fill="#ff6b6b"
          font-family="monospace"
          font-size="12">
        - Payload НЕ зашифрований — це лише Base64URL
    </text>

    <text x="40" y="410"
          fill="#ff6b6b"
          font-family="monospace"
          font-size="12">
        - Не клади секрети або паролі в payload!
    </text>
</svg>
