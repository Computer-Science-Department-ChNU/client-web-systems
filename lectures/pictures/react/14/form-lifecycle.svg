<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#1e1e2e"/>

  <!-- States -->
  <rect x="30" y="60" width="130" height="55" rx="8" fill="#2a2a3e" stroke="#888"/>
  <text x="95" y="88" text-anchor="middle" fill="#888" font-family="monospace" font-size="14" font-weight="bold">idle</text>
  <text x="95" y="105" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">form empty</text>

  <line x1="160" y1="87" x2="200" y2="87" stroke="#888" stroke-width="2" marker-end="url(#f1)"/>

  <rect x="200" y="60" width="130" height="55" rx="8" fill="#2a2a3e" stroke="#d19a66"/>
  <text x="265" y="88" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="14" font-weight="bold">editing</text>
  <text x="265" y="105" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="10">user types</text>

  <line x1="330" y1="75" x2="370" y2="55" stroke="#ff6b6b" stroke-width="2" marker-end="url(#f1r)"/>
  <line x1="330" y1="100" x2="370" y2="120" stroke="#4a9eff" stroke-width="2" marker-end="url(#f1b)"/>

  <rect x="370" y="30" width="140" height="55" rx="8" fill="#2a2a3e" stroke="#ff6b6b"/>
  <text x="440" y="58" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">validation</text>
  <text x="440" y="75" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="10">errors shown</text>

  <rect x="370" y="100" width="140" height="55" rx="8" fill="#2a2a3e" stroke="#4a9eff"/>
  <text x="440" y="128" text-anchor="middle" fill="#4a9eff" font-family="monospace" font-size="13" font-weight="bold">submitting</text>
  <text x="440" y="145" text-anchor="middle" fill="#4a9eff" font-family="monospace" font-size="10">API call...</text>

  <line x1="510" y1="127" x2="550" y2="80" stroke="#51cf66" stroke-width="2" marker-end="url(#f1g)"/>
  <line x1="510" y1="127" x2="550" y2="160" stroke="#ff6b6b" stroke-width="2" marker-end="url(#f1r)"/>

  <rect x="550" y="55" width="140" height="55" rx="8" fill="#2a2a3e" stroke="#51cf66"/>
  <text x="620" y="83" text-anchor="middle" fill="#51cf66" font-family="monospace" font-size="13" font-weight="bold">success</text>
  <text x="620" y="100" text-anchor="middle" fill="#51cf66" font-family="monospace" font-size="10">redirect</text>

  <rect x="550" y="135" width="140" height="55" rx="8" fill="#2a2a3e" stroke="#ff6b6b"/>
  <text x="620" y="163" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">error</text>
  <text x="620" y="180" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="10">show message</text>

  <line x1="620" y1="190" x2="620" y2="225" stroke="#888" stroke-width="2" marker-end="url(#f1)"/>
  <line x1="620" y1="225" x2="265" y2="225" stroke="#888" stroke-width="2"/>
  <line x1="265" y1="225" x2="265" y2="115" stroke="#888" stroke-width="2" marker-end="url(#f1)"/>
  <text x="440" y="220" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">back to editing</text>

  <!-- UI per state -->
  <rect x="20" y="250" width="680" height="115" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="40" y="275" fill="#61DAFB" font-family="monospace" font-size="14" font-weight="bold">UI для кожного стану:</text>
  <text x="40" y="300" fill="#d19a66" font-family="monospace" font-size="13">editing   &#8594; input fields, validation hints on blur, submit button enabled</text>
  <text x="40" y="320" fill="#ff6b6b" font-family="monospace" font-size="13">validation&#8594; red border, error text per field, submit disabled if invalid</text>
  <text x="40" y="340" fill="#4a9eff" font-family="monospace" font-size="13">submitting&#8594; button disabled + spinner, inputs readonly</text>
  <text x="40" y="360" fill="#51cf66" font-family="monospace" font-size="13">success   &#8594; redirect or success toast; error &#8594; error toast + form back to editing</text>

  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="f1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#51cf66"/>
    </marker>
    <marker id="f1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="f1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9eff"/>
    </marker>
  </defs>
</svg>
