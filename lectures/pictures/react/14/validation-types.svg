<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <rect width="720" height="340" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Валідація — типи правил</text>

  <rect x="20" y="55" width="340" height="130" rx="8" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="40" y="80" fill="#4a9eff" font-family="monospace" font-size="14" font-weight="bold">Синтаксична (format)</text>
  <text x="40" y="105" fill="#ccc" font-family="monospace" font-size="12">- email format: /\S+@\S+\.\S+/</text>
  <text x="40" y="123" fill="#ccc" font-family="monospace" font-size="12">- password: min 8 chars, 1 digit</text>
  <text x="40" y="141" fill="#ccc" font-family="monospace" font-size="12">- phone: +380XXXXXXXXX</text>
  <text x="40" y="159" fill="#ccc" font-family="monospace" font-size="12">- url, date, credit card format</text>
  <text x="40" y="177" fill="#888" font-family="monospace" font-size="11">// перевіряється на frontend</text>

  <rect x="380" y="55" width="320" height="130" rx="8" fill="#1a1a2e" stroke="#d19a66"/>
  <text x="400" y="80" fill="#d19a66" font-family="monospace" font-size="14" font-weight="bold">Бізнес-логіка (semantic)</text>
  <text x="400" y="105" fill="#ccc" font-family="monospace" font-size="12">- email already exists</text>
  <text x="400" y="123" fill="#ccc" font-family="monospace" font-size="12">- username unique</text>
  <text x="400" y="141" fill="#ccc" font-family="monospace" font-size="12">- old password correct</text>
  <text x="400" y="159" fill="#ccc" font-family="monospace" font-size="12">- quota exceeded</text>
  <text x="400" y="177" fill="#888" font-family="monospace" font-size="11">// перевіряється на backend</text>

  <rect x="20" y="205" width="680" height="120" rx="8" fill="#2a2a3e" stroke="#444"/>
  <text x="40" y="230" fill="#61DAFB" font-family="monospace" font-size="14" font-weight="bold">Правило:</text>
  <text x="160" y="230" fill="#ccc" font-family="monospace" font-size="13">Frontend validation &#8800; security. Always validate on backend too!</text>
  <text x="40" y="260" fill="#51cf66" font-family="monospace" font-size="13">+ Frontend: better UX (instant feedback, no round-trip)</text>
  <text x="40" y="285" fill="#ff6b6b" font-family="monospace" font-size="13">- Frontend can be bypassed (devtools, curl) &#8212; not security</text>
  <text x="40" y="310" fill="#ccc" font-family="monospace" font-size="13">Backend MUST validate everything &#8212; frontend is convenience, not protection</text>
</svg>