<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390">
    <rect width="720" height="390" fill="#1e1e2e"/>

    <!-- Title -->
    <text x="360" y="35"
          text-anchor="middle"
          fill="#61DAFB"
          font-family="monospace"
          font-size="18"
          font-weight="bold">
        Token Refresh — автоматичне оновлення
    </text>

    <!-- Timeline -->
    <line x1="70" y1="175" x2="650" y2="175"
          stroke="#444" stroke-width="3"/>

    <!-- T0: Login -->
    <circle cx="90" cy="175" r="9" fill="#51cf66"/>

    <text x="90" y="145"
          text-anchor="middle"
          fill="#51cf66"
          font-family="monospace"
          font-size="12"
          font-weight="bold">
        t=0
    </text>

    <text x="90" y="205"
          text-anchor="middle"
          fill="#ccc"
          font-family="monospace"
          font-size="11">
        login
    </text>

    <text x="90" y="222"
          text-anchor="middle"
          fill="#888"
          font-family="monospace"
          font-size="10">
        access + refresh
    </text>

    <!-- T1: Access expires -->
    <circle cx="270" cy="175" r="9" fill="#d19a66"/>

    <text x="270" y="145"
          text-anchor="middle"
          fill="#d19a66"
          font-family="monospace"
          font-size="12"
          font-weight="bold">
        t=15min
    </text>

    <text x="270" y="205"
          text-anchor="middle"
          fill="#ccc"
          font-family="monospace"
          font-size="11">
        access expires
    </text>

    <text x="270" y="222"
          text-anchor="middle"
          fill="#888"
          font-family="monospace"
          font-size="10">
        API returns 401
    </text>

    <!-- T1.5: Refresh -->
    <circle cx="390" cy="175" r="9" fill="#4a9eff"/>

    <text x="390" y="145"
          text-anchor="middle"
          fill="#4a9eff"
          font-family="monospace"
          font-size="12"
          font-weight="bold">
        auto
    </text>

    <text x="390" y="205"
          text-anchor="middle"
          fill="#ccc"
          font-family="monospace"
          font-size="11">
        refresh token
    </text>

    <text x="390" y="222"
          text-anchor="middle"
          fill="#888"
          font-family="monospace"
          font-size="10">
        POST /api/refresh
    </text>

    <!-- T2: New access -->
    <circle cx="500" cy="175" r="9" fill="#51cf66"/>

    <text x="500" y="145"
          text-anchor="middle"
          fill="#51cf66"
          font-family="monospace"
          font-size="12"
          font-weight="bold">
        new token
    </text>

    <text x="500" y="205"
          text-anchor="middle"
          fill="#ccc"
          font-family="monospace"
          font-size="11">
        retry original
    </text>

    <text x="500" y="222"
          text-anchor="middle"
          fill="#888"
          font-family="monospace"
          font-size="10">
        request succeeds
    </text>

    <!-- T3: Refresh expires -->
    <circle cx="630" cy="175" r="9" fill="#ff6b6b"/>

    <text x="630" y="145"
          text-anchor="middle"
          fill="#ff6b6b"
          font-family="monospace"
          font-size="12"
          font-weight="bold">
        t=7days
    </text>

    <text x="630" y="205"
          text-anchor="middle"
          fill="#ccc"
          font-family="monospace"
          font-size="11">
        refresh expires
    </text>

    <text x="630" y="222"
          text-anchor="middle"
          fill="#ff6b6b"
          font-family="monospace"
          font-size="10">
        → logout + /login
    </text>

    <!-- Refresh arrows -->
    <line x1="280" y1="175" x2="380" y2="175"
          stroke="#d19a66"
          stroke-width="2"
          stroke-dasharray="5,3"
          marker-end="url(#arrow-orange)"/>

    <line x1="400" y1="175" x2="490" y2="175"
          stroke="#4a9eff"
          stroke-width="2"
          marker-end="url(#arrow-blue)"/>

    <!-- Description box -->
    <rect x="20" y="260" width="680" height="110"
          rx="8"
          fill="#2a2a3e"
          stroke="#444"/>

    <text x="40" y="286"
          fill="#d19a66"
          font-family="monospace"
          font-size="12"
          font-weight="bold">
        ACCESS TOKEN
    </text>

    <text x="40" y="305"
          fill="#ccc"
          font-family="monospace"
          font-size="11">
        short-lived (15min) → 401 interceptor catches expired token
    </text>

    <text x="40" y="330"
          fill="#4a9eff"
          font-family="monospace"
          font-size="12"
          font-weight="bold">
        REFRESH TOKEN
    </text>

    <text x="40" y="349"
          fill="#ccc"
          font-family="monospace"
          font-size="11">
        long-lived (7days) → gets a new access token without re-login
    </text>

    <text x="40" y="365"
          fill="#888"
          font-family="monospace"
          font-size="10">
        If refresh fails → logout user → redirect to /login
    </text>

    <!-- Arrow markers -->
    <defs>
        <marker id="arrow-orange"
                viewBox="0 0 10 10"
                refX="9"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d19a66"/>
        </marker>

        <marker id="arrow-blue"
                viewBox="0 0 10 10"
                refX="9"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a9eff"/>
        </marker>
    </defs>
</svg>
