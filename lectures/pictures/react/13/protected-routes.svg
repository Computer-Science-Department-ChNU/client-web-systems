<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">Protected Routes — auth flow</text>

  <!-- User tries to access -->
  <rect x="20" y="60" width="160" height="60" rx="8" fill="#2a2a3e" stroke="#d19a66"/>
  <text x="100" y="88" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="12" font-weight="bold">User</text>
  <text x="100" y="108" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="11">visits /dashboard</text>

  <line x1="180" y1="90" x2="240" y2="90" stroke="#888" stroke-width="2" marker-end="url(#p1)"/>

  <!-- Route check -->
  <rect x="240" y="60" width="180" height="60" rx="8" fill="#2a2a3e" stroke="#4a9eff"/>
  <text x="330" y="85" text-anchor="middle" fill="#4a9eff" font-family="monospace" font-size="12" font-weight="bold">&lt;ProtectedRoute&gt;</text>
  <text x="330" y="108" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="11">isAuthenticated?</text>

  <!-- No branch -->
  <line x1="330" y1="120" x2="200" y2="175" stroke="#ff6b6b" stroke-width="2" marker-end="url(#p1r)"/>
  <text x="220" y="150" fill="#ff6b6b" font-family="monospace" font-size="11">NO</text>

  <!-- Yes branch -->
  <line x1="330" y1="120" x2="460" y2="175" stroke="#51cf66" stroke-width="2" marker-end="url(#p1g)"/>
  <text x="420" y="150" fill="#51cf66" font-family="monospace" font-size="11">YES</text>

  <!-- Redirect to login -->
  <rect x="100" y="175" width="200" height="55" rx="8" fill="#ff6b6b"/>
  <text x="200" y="200" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">&lt;Navigate to="/login" /&gt;</text>
  <text x="200" y="220" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">redirect + save returnUrl</text>

  <!-- Render protected -->
  <rect x="360" y="175" width="200" height="55" rx="8" fill="#51cf66"/>
  <text x="460" y="200" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="12" font-weight="bold">&lt;Dashboard /&gt;</text>
  <text x="460" y="220" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="10">rendered</text>

  <!-- After login -->
  <line x1="200" y1="230" x2="200" y2="270" stroke="#ff6b6b" stroke-width="2"/>
  <rect x="80" y="270" width="240" height="50" rx="8" fill="#2a2a3e" stroke="#d19a66"/>
  <text x="200" y="300" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="12">Login form &#8594; submit &#8594; setToken</text>

  <line x1="200" y1="320" x2="200" y2="345" stroke="#51cf66" stroke-width="2" marker-end="url(#p1g)"/>
  <text x="360" y="360" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">&#8594; redirect back to /dashboard</text>

  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="p1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#51cf66"/>
    </marker>
    <marker id="p1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/>
    </marker>
  </defs>
</svg>