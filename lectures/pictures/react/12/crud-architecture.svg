<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <rect width="720" height="360" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">CRUD App — архітектура</text>

  <!-- App -->
  <rect x="280" y="55" width="160" height="50" rx="8" fill="#61DAFB"/>
  <text x="360" y="85" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="14" font-weight="bold">App</text>

  <line x1="300" y1="105" x2="160" y2="135" stroke="#888" stroke-width="2"/>
  <line x1="360" y1="105" x2="360" y2="135" stroke="#888" stroke-width="2"/>
  <line x1="420" y1="105" x2="560" y2="135" stroke="#888" stroke-width="2"/>

  <!-- List -->
  <rect x="60" y="135" width="180" height="50" rx="8" fill="#4a9eff"/>
  <text x="150" y="165" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13" font-weight="bold">UserListPage</text>

  <!-- Detail -->
  <rect x="270" y="135" width="180" height="50" rx="8" fill="#4a9eff"/>
  <text x="360" y="165" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13" font-weight="bold">UserDetailPage</text>

  <!-- Form -->
  <rect x="480" y="135" width="180" height="50" rx="8" fill="#4a9eff"/>
  <text x="570" y="165" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13" font-weight="bold">UserFormPage</text>

  <line x1="150" y1="185" x2="150" y2="215" stroke="#888" stroke-width="2"/>
  <line x1="360" y1="185" x2="360" y2="215" stroke="#888" stroke-width="2"/>
  <line x1="570" y1="185" x2="570" y2="215" stroke="#888" stroke-width="2"/>

  <!-- Hooks -->
  <rect x="60" y="215" width="180" height="50" rx="8" fill="#d19a66"/>
  <text x="150" y="245" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="13" font-weight="bold">useUsers()</text>
  <rect x="270" y="215" width="180" height="50" rx="8" fill="#d19a66"/>
  <text x="360" y="245" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="13" font-weight="bold">useUser(id)</text>
  <rect x="480" y="215" width="180" height="50" rx="8" fill="#d19a66"/>
  <text x="570" y="245" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="13" font-weight="bold">useUserMutations()</text>

  <line x1="150" y1="265" x2="150" y2="295" stroke="#888" stroke-width="2"/>
  <line x1="360" y1="265" x2="360" y2="295" stroke="#888" stroke-width="2"/>
  <line x1="570" y1="265" x2="570" y2="295" stroke="#888" stroke-width="2"/>

  <!-- API -->
  <rect x="120" y="295" width="480" height="50" rx="8" fill="#ff6b6b"/>
  <text x="360" y="325" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">api/users.ts (getUsers, getUser, createUser, updateUser, deleteUser)</text>
</svg>
