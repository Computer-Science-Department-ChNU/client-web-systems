<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#1e1e2e"/>

  <!-- Idle -->
  <rect x="30" y="60" width="140" height="60" rx="8" fill="#2a2a3e" stroke="#888"/>
  <text x="100" y="90" text-anchor="middle" fill="#888" font-family="monospace" font-size="14" font-weight="bold">idle</text>
  <text x="100" y="110" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">status="idle"</text>

  <line x1="170" y1="90" x2="210" y2="90" stroke="#888" stroke-width="2" marker-end="url(#s1)"/>

  <!-- Loading -->
  <rect x="210" y="60" width="140" height="60" rx="8" fill="#2a2a3e" stroke="#d19a66"/>
  <text x="280" y="90" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="14" font-weight="bold">loading</text>
  <text x="280" y="110" text-anchor="middle" fill="#d19a66" font-family="monospace" font-size="11">status="loading"</text>

  <line x1="350" y1="75" x2="410" y2="55" stroke="#51cf66" stroke-width="2" marker-end="url(#s1g)"/>
  <line x1="350" y1="105" x2="410" y2="170" stroke="#ff6b6b" stroke-width="2" marker-end="url(#s1r)"/>

  <!-- Success -->
  <rect x="410" y="30" width="160" height="60" rx="8" fill="#2a2a3e" stroke="#51cf66"/>
  <text x="490" y="60" text-anchor="middle" fill="#51cf66" font-family="monospace" font-size="14" font-weight="bold">success</text>
  <text x="490" y="80" text-anchor="middle" fill="#51cf66" font-family="monospace" font-size="11">status="success"</text>

  <!-- Error -->
  <rect x="410" y="150" width="160" height="60" rx="8" fill="#2a2a3e" stroke="#ff6b6b"/>
  <text x="490" y="180" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="14" font-weight="bold">error</text>
  <text x="490" y="200" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11">status="error"</text>

  <!-- Code example -->
  <rect x="20" y="230" width="680" height="175" rx="8" fill="#1a1a2e" stroke="#444"/>
  <text x="40" y="255" fill="#61DAFB" font-family="monospace" font-size="13" font-weight="bold">type Status = "idle" | "loading" | "success" | "error"</text>
  <text x="40" y="285" fill="#c678dd" font-family="monospace" font-size="13">const</text>
  <text x="85" y="285" fill="#ccc" font-family="monospace" font-size="13">[status, setStatus] = useState&lt;Status&gt;("idle")</text>
  <text x="40" y="310" fill="#c678dd" font-family="monospace" font-size="13">const</text>
  <text x="85" y="310" fill="#ccc" font-family="monospace" font-size="13">[data, setData] = useState&lt;T | null&gt;(null)</text>
  <text x="40" y="335" fill="#c678dd" font-family="monospace" font-size="13">const</text>
  <text x="85" y="335" fill="#ccc" font-family="monospace" font-size="13">[error, setError] = useState&lt;string | null&gt;(null)</text>
  <text x="40" y="365" fill="#888" font-family="monospace" font-size="12">// setStatus("loading") &#8594; fetch &#8594; setStatus("success") / setStatus("error")</text>
  <text x="40" y="390" fill="#888" font-family="monospace" font-size="12">// UI: if loading Spinner | if error ErrorMessage | if success DataList</text>

  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="s1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#51cf66"/>
    </marker>
    <marker id="s1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/>
    </marker>
  </defs>
</svg>
