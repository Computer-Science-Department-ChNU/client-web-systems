<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <rect width="720" height="340" fill="#1e1e2e"/>

  <text x="360" y="35" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="18" font-weight="bold">useMutation — зміна даних + invalidation</text>

  <!-- Flow -->
  <rect x="20" y="60" width="140" height="55" rx="8" fill="#4a9eff"/>
  <text x="90" y="85" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">1. useMutation</text>
  <text x="90" y="103" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">mutate(data)</text>

  <line x1="160" y1="87" x2="200" y2="87" stroke="#888" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="200" y="60" width="140" height="55" rx="8" fill="#d19a66"/>
  <text x="270" y="85" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="12" font-weight="bold">2. POST /api</text>
  <text x="270" y="103" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="10">mutationFn</text>

  <line x1="340" y1="87" x2="380" y2="87" stroke="#888" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="380" y="60" width="140" height="55" rx="8" fill="#51cf66"/>
  <text x="450" y="85" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="12" font-weight="bold">3. onSuccess</text>
  <text x="450" y="103" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="10">invalidateQueries</text>

  <line x1="520" y1="87" x2="560" y2="87" stroke="#888" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="560" y="60" width="140" height="55" rx="8" fill="#ff6b6b"/>
  <text x="630" y="85" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">4. Refetch</text>
  <text x="630" y="103" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">["users"] query</text>

  <!-- Code -->
  <rect x="20" y="135" width="680" height="190" rx="8" fill="#1a1a2e" stroke="#444"/>
  <text x="40" y="160" fill="#61DAFB" font-family="monospace" font-size="13" font-weight="bold">const mutation = useMutation({</text>
  <text x="60" y="180" fill="#d19a66" font-family="monospace" font-size="13">mutationFn: (newUser) =&gt; api.createUser(newUser),</text>
  <text x="60" y="200" fill="#51cf66" font-family="monospace" font-size="13">onSuccess: () =&gt; {</text>
  <text x="80" y="220" fill="#ccc" font-family="monospace" font-size="13">queryClient.invalidateQueries({ queryKey: ["users"] })</text>
  <text x="80" y="240" fill="#888" font-family="monospace" font-size="12">// &#8594; refetch all ["users"] queries automatically</text>
  <text x="60" y="260" fill="#51cf66" font-family="monospace" font-size="13">},</text>
  <text x="60" y="280" fill="#ff6b6b" font-family="monospace" font-size="13">onError: (err) =&gt; showToast(err.message)</text>
  <text x="40" y="300" fill="#61DAFB" font-family="monospace" font-size="13">})</text>
  <text x="40" y="320" fill="#888" font-family="monospace" font-size="12">// mutation.mutate({ name: "Anna", email: "anna@x.com" })</text>

  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
</svg>