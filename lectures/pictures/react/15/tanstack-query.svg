<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 720 470"
     width="720"
     height="470">

    <rect width="720" height="470" fill="#1e1e2e"/>

    <!-- Title -->
    <text x="360" y="35"
          text-anchor="middle"
          fill="#61DAFB"
          font-family="monospace"
          font-size="18"
          font-weight="bold">
        TanStack Query — як це працює
    </text>

    <!-- Component -->
    <rect x="220" y="55"
          width="280" height="50"
          rx="8"
          fill="#4a9eff"/>

    <text x="360" y="85"
          text-anchor="middle"
          fill="#fff"
          font-family="monospace"
          font-size="14"
          font-weight="bold">
        Component: useQuery()
    </text>

    <!-- Component → Cache -->
    <line x1="360" y1="105"
          x2="360" y2="135"
          stroke="#888"
          stroke-width="2"
          marker-end="url(#arrow)"/>

    <!-- Query Cache -->
    <rect x="80" y="135"
          width="560" height="105"
          rx="8"
          fill="#d19a66"/>

    <text x="360" y="160"
          text-anchor="middle"
          fill="#1e1e2e"
          font-family="monospace"
          font-size="14"
          font-weight="bold">
        Query Cache
    </text>

    <text x="360" y="180"
          text-anchor="middle"
          fill="#1e1e2e"
          font-family="monospace"
          font-size="11">
        shared in-memory cache
    </text>

    <!-- Query keys -->
    <text x="110" y="202"
          fill="#1e1e2e"
          font-family="monospace"
          font-size="11">
        ["users"]
    </text>

    <text x="270" y="202"
          fill="#1e1e2e"
          font-family="monospace"
          font-size="11">
        ["user", "42"]
    </text>

    <text x="450" y="202"
          fill="#1e1e2e"
          font-family="monospace"
          font-size="11">
        ["products", {page: 2}]
    </text>

    <text x="360" y="225"
          text-anchor="middle"
          fill="#1e1e2e"
          font-family="monospace"
          font-size="10">
        data · status · fetching · updatedAt · observers
    </text>

    <!-- Cache → Fetcher -->
    <line x1="360" y1="240"
          x2="360" y2="270"
          stroke="#888"
          stroke-width="2"
          marker-end="url(#arrow)"/>

    <!-- Fetcher -->
    <rect x="200" y="270"
          width="320" height="50"
          rx="8"
          fill="#51cf66"/>

    <text x="360" y="291"
          text-anchor="middle"
          fill="#1e1e2e"
          font-family="monospace"
          font-size="12"
          font-weight="bold">
        queryFn / fetcher
    </text>

    <text x="360" y="308"
          text-anchor="middle"
          fill="#1e1e2e"
          font-family="monospace"
          font-size="10">
        axios.get("/api/users")
    </text>

    <!-- Fetcher → Server -->
    <line x1="360" y1="320"
          x2="360" y2="345"
          stroke="#888"
          stroke-width="2"
          marker-end="url(#arrow)"/>

    <!-- Server -->
    <rect x="220" y="345"
          width="280" height="45"
          rx="8"
          fill="#ff6b6b"/>

    <text x="360" y="373"
          text-anchor="middle"
          fill="#fff"
          font-family="monospace"
          font-size="14"
          font-weight="bold">
        Backend REST API
    </text>

    <!-- Response -->
    <line x1="220" y1="367"
          x2="175" y2="367"
          stroke="#51cf66"
          stroke-width="2"
          stroke-dasharray="5,3"
          marker-end="url(#arrow-green)"/>

    <text x="100" y="363"
          text-anchor="middle"
          fill="#51cf66"
          font-family="monospace"
          font-size="10">
        response
    </text>

    <!-- Features -->
    <rect x="20" y="405"
          width="680" height="50"
          rx="8"
          fill="#2a2a3e"
          stroke="#444"/>

    <text x="360" y="425"
          text-anchor="middle"
          fill="#51cf66"
          font-family="monospace"
          font-size="10">
        cache · dedup · refetch · retry · invalidation · prefetch
    </text>

    <text x="360" y="443"
          text-anchor="middle"
          fill="#51cf66"
          font-family="monospace"
          font-size="10">
        pagination · infinite queries · optimistic updates · reconnect
    </text>

    <!-- Arrow markers -->
    <defs>
        <marker id="arrow"
                viewBox="0 0 10 10"
                refX="9"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#888"/>
        </marker>

        <marker id="arrow-green"
                viewBox="0 0 10 10"
                refX="9"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#51cf66"/>
        </marker>
    </defs>

</svg>
